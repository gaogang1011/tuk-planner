<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>툭 플래너</title>
<meta name="description" content="툭 던지면 알아서 정리되는 AI 일정·할 일 관리">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1C2433">
</head>
<body>
<div class="app" id="app">
  <aside class="sb" id="sidebar" aria-label="사이드바">
    <div class="sb-head">
      <span class="brand">툭</span>
      <span class="sb-name">플래너</span>
      <button type="button" class="ic" data-act="toggle-sidebar" aria-label="사이드바 접기" title="사이드바 접기 ([)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 5 6 10l5 5M15 5l-5 5 5 5"/></svg></button>
    </div>
    <button type="button" class="sb-search" data-act="palette"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg><span>검색하거나 추가</span><kbd class="kbd-mod">Ctrl K</kbd></button>
    <div class="sb-block" id="miniCal"></div>
    <div class="sb-block sb-grow" id="sbTasks"></div>
    <div class="sb-foot">
      <button type="button" class="sb-link" data-act="widget">화면에 띄우기</button>
      <button type="button" class="sb-link" data-act="shortcuts">단축키</button>
      <button type="button" class="sb-link" id="openSettings">설정</button>
    </div>
  </aside>
  <main class="main" id="main">
    <header class="mh" id="mainHead"></header>
    <section class="capture" id="capture" aria-label="입력"></section>
    <section class="cal-body" id="calBody" aria-label="캘린더"></section>
  </main>
  <aside class="rp" id="panel" aria-label="오늘"></aside>
  <div class="scrim" data-act="close-drawers"></div>
</div>

<script src="js/format.js"></script>
<script src="js/store.js"></script>
<script src="js/parser.js"></script>
<script src="js/views.js"></script>
<script src="js/ai.js"></script>
<script src="js/settings.js"></script>
<script src="js/capture.js"></script>
<script src="js/now.js"></script>
<script src="js/holidays.js"></script>
<script src="js/calendar.js"></script>
<script src="js/detail.js"></script>
<script src="js/week.js"></script>
<script src="js/month.js"></script>
<script src="js/drag.js"></script>
<script src="js/app.js"></script>
</body>
</html>
