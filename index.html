<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>툭 플래너</title>
<meta name="description" content="툭 던지면 알아서 정리되는 AI 일정·할 일 관리">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">툭</h1>
  <p class="clock" id="clock"></p>
  <button class="icon-btn" id="openSettings" type="button" aria-label="설정">설정</button>
</header>

<main class="layout">
  <section class="capture" id="capture" aria-label="입력"></section>
  <section class="now" id="now" aria-label="지금과 다음"></section>
  <div class="columns">
    <section class="panel" id="today" aria-label="오늘 남은 것"></section>
    <section class="panel" id="upcoming" aria-label="앞으로의 일정"></section>
  </div>
</main>

<script src="js/format.js"></script>
<script src="js/store.js"></script>
<script src="js/parser.js"></script>
<script src="js/views.js"></script>
<script src="js/settings.js"></script>
<script src="js/capture.js"></script>
<script src="js/app.js"></script>
</body>
</html>
